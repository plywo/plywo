services:
  plywo:
    image: ghcr.io/plywo/plywo:${PLYWO_IMAGE_TAG:?set PLYWO_IMAGE_TAG to an immutable release or sha tag}
    restart: unless-stopped
    env_file:
      - .env.control-plane
    volumes:
      - ./.secrets:/run/secrets:ro
    expose:
      - "3000"

  tunnel:
    image: ${PLYWO_CLOUDFLARED_IMAGE:?set PLYWO_CLOUDFLARED_IMAGE to an immutable cloudflared image reference}
    restart: unless-stopped
    env_file:
      - .env.control-plane.tunnel
    command: tunnel --no-autoupdate run
    depends_on:
      - plywo
