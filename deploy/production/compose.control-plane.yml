services:
  migrate:
    image: ghcr.io/plywo/plywo:${PLYWO_IMAGE_TAG:?set PLYWO_IMAGE_TAG to an immutable release or sha tag}
    env_file:
      - .env.control-plane
    volumes:
      - ./.secrets:/run/secrets:ro
    command: bin/rails db:prepare
    restart: "no"

  plywo:
    image: ghcr.io/plywo/plywo:${PLYWO_IMAGE_TAG:?set PLYWO_IMAGE_TAG to an immutable release or sha tag}
    restart: unless-stopped
    env_file:
      - .env.control-plane
    volumes:
      - ./.secrets:/run/secrets:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "3000"

  worker:
    image: ghcr.io/plywo/plywo:${PLYWO_IMAGE_TAG:?set PLYWO_IMAGE_TAG to an immutable release or sha tag}
    restart: unless-stopped
    env_file:
      - .env.control-plane
    volumes:
      - ./.secrets:/run/secrets:ro
    command: bin/jobs
    depends_on:
      migrate:
        condition: service_completed_successfully

  tunnel:
    image: ${PLYWO_CLOUDFLARED_IMAGE:?set PLYWO_CLOUDFLARED_IMAGE to an immutable cloudflared image reference}
    restart: unless-stopped
    env_file:
      - .env.control-plane.tunnel
    command: tunnel --no-autoupdate run
    depends_on:
      - plywo
