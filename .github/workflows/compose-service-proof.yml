name: Compose Service Proof

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compose_service_proof:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.10"
          bundler-cache: true

      - name: Verify Docker Compose is host capability
        run: |
          docker compose version
          test -S /var/run/docker.sock

      - name: Prove explicit Compose service lifecycle
        run: ruby script/prove_compose_service_provider.rb
