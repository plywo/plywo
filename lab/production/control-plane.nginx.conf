events {}

http {
  server {
    listen 4444 ssl;
    server_name control-plane-tls;

    ssl_certificate /lab-tls/control-plane-tls.crt;
    ssl_certificate_key /lab-tls/control-plane-tls.key;

    location / {
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://control-plane:3000;
    }
  }
}
