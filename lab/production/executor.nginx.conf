events {}

http {
  server {
    listen 4443 ssl;
    server_name executor-tls;

    ssl_certificate /lab-tls/executor-tls.crt;
    ssl_certificate_key /lab-tls/executor-tls.key;

    location / {
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://executor:3000;
    }
  }
}
